<!--
  side_panel.html — Roundtable のサイドパネル本体
  ============================================================
  Phase 1 Step 1A:
    - 入力欄に文字を入れて送信すると、claude.ai タブの入力欄に注入＋送信
    - ログエリアでセレクタ／注入手段／Cloudflare 検知などを可視化
    - 「DOMロガー起動」ボタンは Step 1B で実装するため現時点では disabled
  ============================================================
-->
<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Roundtable</title>
    <style>
      :root {
        --bg: #ffffff;
        --fg: #1f2328;
        --muted: #6b7280;
        --border: #e5e7eb;
        --accent: #2563eb;
        --accent-hover: #1d4ed8;
        --error: #b91c1c;
        --warn: #b45309;
        --info: #1f2937;
        --ok: #047857;
        --log-bg: #f6f8fa;
      }
      * { box-sizing: border-box; }
      html, body {
        height: 100%;
        margin: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--fg);
        background: var(--bg);
        display: flex;
        flex-direction: column;
        font-size: 13px;
      }
      header {
        padding: 10px 14px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: baseline;
        gap: 8px;
      }
      header h1 {
        font-size: 14px;
        margin: 0;
      }
      header .phase {
        color: var(--muted);
        font-size: 11px;
      }
      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
        padding: 10px 14px;
        gap: 10px;
      }
      .tab-row {
        display: flex;
        gap: 6px;
        align-items: center;
        font-size: 11.5px;
      }
      .tab-row label {
        color: var(--muted);
        white-space: nowrap;
      }
      .tab-row select {
        flex: 1;
        min-width: 0;
        padding: 5px 8px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: #fff;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11.5px;
      }
      .tab-actions {
        display: flex;
        gap: 6px;
        justify-content: flex-end;
      }
      .tab-actions button {
        padding: 4px 9px;
        font-size: 11px;
      }
      .log-area {
        flex: 1;
        min-height: 120px;
        overflow-y: auto;
        background: var(--log-bg);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 8px 10px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11.5px;
        line-height: 1.5;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .log-line {
        margin: 0;
        padding: 1px 0;
      }
      .log-line .ts {
        color: var(--muted);
        margin-right: 6px;
      }
      .log-line.info { color: var(--info); }
      .log-line.ok { color: var(--ok); }
      .log-line.warn { color: var(--warn); }
      .log-line.error { color: var(--error); font-weight: 600; }

      .input-row {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      textarea {
        width: 100%;
        min-height: 60px;
        max-height: 180px;
        resize: vertical;
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: 6px;
        font-family: inherit;
        font-size: 13px;
        line-height: 1.5;
      }
      textarea:focus {
        outline: 2px solid var(--accent);
        outline-offset: -1px;
      }
      .button-row {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .logger-row {
        justify-content: flex-start;
      }
      .logger-row button {
        font-size: 11.5px;
        padding: 5px 10px;
      }
      .log-block {
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 6px 8px;
        margin: 4px 0 0 0;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 10.5px;
        line-height: 1.5;
        white-space: pre;
        overflow: auto;
        max-height: 380px;
      }
      .block-actions {
        display: flex;
        gap: 6px;
        margin-top: 4px;
      }
      .block-actions button {
        font-size: 10.5px;
        padding: 3px 8px;
      }
      .response-frame {
        margin: 6px 0 4px 0;
        background: #ecfdf5;
        border: 1px solid #6ee7b7;
        border-radius: 6px;
        padding: 8px 10px;
      }
      .response-frame .response-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 4px;
        font-size: 11.5px;
        color: var(--info);
      }
      .response-frame .response-meta {
        color: var(--muted);
        font-size: 11px;
      }
      .response-frame .response-text {
        white-space: pre-wrap;
        word-break: break-word;
        font-size: 12.5px;
        line-height: 1.6;
        margin: 0;
        max-height: 420px;
        overflow: auto;
      }
      button {
        padding: 7px 14px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: #fff;
        color: var(--fg);
        font-size: 12.5px;
        cursor: pointer;
      }
      button.primary {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
      }
      button.primary:hover {
        background: var(--accent-hover);
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }
      .clear-btn {
        font-size: 11px;
        padding: 4px 8px;
        color: var(--muted);
      }
      .log-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 11px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>🎙️ Roundtable</h1>
      <span class="phase">Phase 1 Step 1A — claude.ai 送信パイプライン</span>
    </header>
    <main>
      <div class="tab-row">
        <label for="tab-select">送信先タブ:</label>
        <select id="tab-select"></select>
      </div>
      <div class="tab-actions">
        <button
          id="use-current-tab"
          type="button"
          title="現在のウィンドウのアクティブタブ（このサイドパネルを開いているタブ）を送信先にする"
        >
          📍 現在のタブを送信先に
        </button>
        <button id="reload-tabs" type="button" title="claude.ai のタブ一覧を再取得">
          再読込
        </button>
      </div>
      <div class="log-header">
        <span>ログ</span>
        <button id="clear-log" class="clear-btn" type="button">クリア</button>
      </div>
      <div id="log" class="log-area" aria-live="polite"></div>
      <div class="input-row">
        <textarea
          id="message"
          placeholder="claude.ai に送るメッセージ（例: こんにちは）"
          spellcheck="false"
        ></textarea>
        <div class="button-row logger-row">
          <button
            id="dom-logger"
            type="button"
            title="60秒間 MutationObserver で claude.ai の DOM 変化を採取"
          >
            📋 DOMロガー (60秒)
          </button>
          <button
            id="show-latest-log"
            type="button"
            title="chrome.storage.local に保存済みの最新 DOM ログを表示"
          >
            📂 最新DOMログ
          </button>
          <button
            id="show-latest-snapshot"
            type="button"
            title="応答抽出失敗時に採取された最新 assistant スナップショットを表示"
          >
            📂 最新スナップショット
          </button>
        </div>
        <div class="button-row">
          <button id="ping" type="button" title="claude.ai タブに content_script が注入されているか確認">
            診断: ping
          </button>
          <button id="send" class="primary" type="button">送信</button>
        </div>
      </div>
    </main>
    <script src="side_panel.js"></script>
  </body>
</html>
